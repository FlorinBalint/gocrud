syntax = "proto3";

package gocrud.entity;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/FlorinBalint/gocrud/proto/entity;entity";

// Method enumerates the CRUD operations that can be generated for an entity.
enum Method {
  METHOD_UNSPECIFIED = 0;
  CREATE = 1;  // Insert
  GET    = 2;  // Select by primary key
  UPDATE = 3;  // Update by primary key
  DELETE = 4;  // Delete by primary key
  LIST   = 5;  // Select with filtering, ordering, and pagination
  UPSERT = 6;  // Insert or update on primary key conflict
}

extend google.protobuf.MessageOptions {
  // Mark a protobuf message as a database entity.
  // Only messages with this option set will have CRUD code generated.
  bool entity = 50000;

  // Override the SQL table name for this entity.
  // If unset, the table name is derived from the message name.
  string table = 50001;

  // The CRUD methods to generate for this entity.
  // If empty, all methods are generated.
  repeated Method methods = 50002;

  // Set to true to include an etag field in Update/Upsert requests
  // for optimistic concurrency control.
  bool has_etag = 50003;

  // The base HTTP path for the entity collection.
  // If unset, it will be derived from the package and message name,
  // e.g., "/v1/books" for package "library.v1" and message "Book".
  string base_path = 50004;

  // The resource type name for google.api.resource.
  // If unset, it defaults to "<package_name>/<MessageName>".
  // Example: "library.googleapis.com/Book"
  string resource_type = 50005;
}

extend google.protobuf.FieldOptions {
  // Mark a field as part of the entity's primary key.
  // The value indicates the field's position in a composite primary key
  // (e.g. 1 for the first part, 2 for the second, etc.).
  // A value of 0 (or unset) means the field is not part of the primary key.
  int32 primary_key = 50001;

  // Override the SQL column name mapped to this field.
  // If unset, the column name is derived from the proto field name.
  string db_column = 50002;

  // Mark a primary key field as auto-generated by the database
  // (e.g. auto-increment, serial, gen_random_uuid()).
  // At most one primary key field may be auto_generated.
  // The field must also have primary_key set.
  bool auto_generated = 50003;
}
