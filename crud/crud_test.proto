syntax = "proto3";

package crud.test;

option go_package = "github.com/FlorinBalint/gocrud/crud/testdata;testdata";

import "proto/entity/options.proto";

// TestEntity has a user-provided string PK. No auto-generation.
message TestEntity {
  option (gocrud.entity.table) = "my_entities";

  string id = 1 [(gocrud.entity.primary_key) = 1];
  string name = 2 [(gocrud.entity.db_column) = "full_name"];
  int32 age = 3;
}

message CreateTestEntityRequest {
  string parent = 1;
  string id = 2; // matches primary key
  TestEntity entity = 3;
}

// NumericEntity has an auto-generated int32 PK (e.g. auto-increment / serial).
message NumericEntity {
  option (gocrud.entity.table) = "numeric_entities";

  int32 id = 1 [
    (gocrud.entity.primary_key) = 1,
    (gocrud.entity.auto_generated) = true
  ];
  string name = 2;
}

message CreateNumericEntityRequest {
  NumericEntity entity = 1;
}

// UUIDEntity has a string PK auto-generated by the DB (e.g. gen_random_uuid()).
message UUIDEntity {
  option (gocrud.entity.table) = "uuid_entities";

  string id = 1 [
    (gocrud.entity.primary_key) = 1,
    (gocrud.entity.auto_generated) = true
  ];
  string name = 2;
}

message CreateUUIDEntityRequest {
  UUIDEntity entity = 1;
}

// CompositeEntity has a composite PK (tenant_id user-provided, id auto-generated)
// plus a non-PK auto-generated column (version, e.g. set by a DB trigger).
message CompositeEntity {
  option (gocrud.entity.table) = "composite_entities";

  string tenant_id = 1 [(gocrud.entity.primary_key) = 1];
  int64 id = 2 [
    (gocrud.entity.primary_key) = 2,
    (gocrud.entity.auto_generated) = true
  ];
  string name = 3;
  int64 version = 4 [(gocrud.entity.auto_generated) = true];
}

message CreateCompositeEntityRequest {
  string tenant_id = 1; // matches non-auto PK
  CompositeEntity entity = 2;
}
